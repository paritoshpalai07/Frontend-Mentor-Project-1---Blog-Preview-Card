<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./dist/output.css">
  
  <title>Frontend Mentor | Blog preview card</title>
</head>
<body>
  <div class="h-screen w-screen bg-yellow-300 flex justify-center items-center">

    <!-- Blog Card -->
    <div class="bg-white w-72 p-4 rounded-lg flex flex-col justify-center gap-3 hover:shadow-[10px_10px_0_rgba(0,0,0,1)] transition-all md:w-96">

      <img class="rounded-lg" src="assets/images/illustration-article.svg" alt="">

      <div class="flex flex-col">
        <p class="bg-yellow-300 font-bold text-sm p-2.5 inline-block w-20 rounded-sm text-center">Learning</p>
        <p class="pt-2 text-sm">Published 21 Dec 2023</p>
      </div>

      <div>
        <h1 class="font-bold mb-2 text-xl hover:text-yellow-300 cursor-pointer">HTML & CSS foundations</h1>
        <p class="text-base text-gray-700 font-medium">These languages are the backbone of every website, defining structure, content, and presentation.</p>
      </div>

      <!-- Author details -->
      <div class="flex items-center gap-3 mt-2">
        <img class="size-8" src="assets/images/image-avatar.webp" alt="">
        <p class="text-sm font-bold">Greg Hooper</p>
      </div>


    </div>
  </div>
</body>
</html>
